<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CartonConnect admin dashboard.">
  <title>Admin Dashboard | CartonConnect</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard-body">
  <div id="auth-check" class="auth-check">Checking session...</div>
  <div id="dashboard-shell" hidden>
    <header class="site-header compact-header">
      <div class="header-inner">
        <a class="brand" href="../" aria-label="CartonConnect registration"><img class="pacd-logo" src="../assets/pacd.png" alt="PACD"></a>
        <div class="title-block"><p class="eyebrow">Administration</p><h1>CartonConnect</h1></div>
        <button id="logout-button" class="secondary-button" type="button">Log out</button>
      </div>
    </header>
    <main class="dashboard-main">
      <div class="dashboard-heading">
        <div><p class="step-label">Admin dashboard</p><h2>Registrations</h2></div>
        <div class="heading-actions">
          <input id="search-input" class="search-input" type="search" placeholder="Search registrations" aria-label="Search registrations">
          <button id="refresh-button" class="secondary-button" type="button">Refresh</button>
          <button id="settings-button" class="secondary-button" type="button">Password</button>
        </div>
      </div>
      <div class="summary-row" aria-live="polite">
        <span><strong id="total-count">0</strong> total</span>
        <span><strong id="supplier-count">0</strong> suppliers</span>
        <span><strong id="packaging-count">0</strong> packaging suppliers</span>
      </div>
      <section class="table-card" aria-label="Registration records">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Name</th><th>Email</th><th>Supplier</th><th>Assigned factory</th><th>Signup time</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="registrations-body"></tbody>
          </table>
        </div>
        <p id="table-message" class="table-message" role="status">Loading registrations...</p>
      </section>
    </main>
  </div>

  <dialog id="edit-dialog" class="admin-dialog">
    <form id="edit-form" novalidate>
      <div class="dialog-heading"><h2>Edit registration</h2><button class="icon-button" type="button" data-close-dialog="edit-dialog" aria-label="Close">&times;</button></div>
      <input id="edit-id" type="hidden"><input id="edit-type" type="hidden">
      <div class="edit-grid">
        <div class="field"><label for="edit-name">Name</label><input id="edit-name" type="text" maxlength="120" required></div>
        <div class="field"><label for="edit-email">Email</label><input id="edit-email" type="email" maxlength="254" required></div>
        <div id="supplier-edit-fields" class="field field-full">
          <label for="edit-supplier-search">Supplier</label>
          <div id="edit-supplier-combobox" class="combobox">
            <div class="combo-control">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 20-4.4-4.4a8 8 0 1 0-1.4 1.4l4.4 4.4L21 20ZM5 11a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/></svg>
              <input id="edit-supplier-search" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="edit-supplier-options" placeholder="Search and select a supplier" autocomplete="off">
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9.5 5 5 5-5 1.5 1.5-6.5 6.5L5.5 11 7 9.5Z"/></svg>
            </div>
            <div id="edit-supplier-options" class="options-panel" role="listbox" hidden></div>
          </div>

          <div class="factory-edit-field">
            <div class="edit-label-row"><label for="edit-factory-search">Assigned factories</label><span id="edit-factory-count" class="selection-count"></span></div>
            <div id="edit-factory-multiselect" class="multi-select">
              <div class="combo-control">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 20-4.4-4.4a8 8 0 1 0-1.4 1.4l4.4 4.4L21 20ZM5 11a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/></svg>
                <input id="edit-factory-search" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="edit-factory-options" placeholder="Search and select factories" autocomplete="off">
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9.5 5 5 5-5 1.5 1.5-6.5 6.5L5.5 11 7 9.5Z"/></svg>
              </div>
              <div id="edit-factory-options" class="options-panel" hidden></div>
              <div id="edit-selected-factories" class="selected-chips"></div>
            </div>
          </div>
        </div>
        <div id="packaging-edit-fields" class="field field-full" hidden>
          <label for="edit-packaging-supplier">Packaging supplier</label>
          <select id="edit-packaging-supplier"><option>Epyllion Ltd.</option><option>MR Box</option><option>Reflex Packaging Ltd.</option><option>Uniglory Packaging Industries Ltd.</option><option>Union Label &amp; Accessories Ltd.</option><option>Youngshine Packtrims Ltd.</option></select>
        </div>
      </div>
      <p id="edit-status" class="inline-status" role="status"></p>
      <div class="dialog-actions"><button class="secondary-button" type="button" data-close-dialog="edit-dialog">Cancel</button><button class="primary-button" type="submit">Save changes</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" class="admin-dialog small-dialog">
    <form id="delete-form"><h2>Delete registration?</h2><p id="delete-description">This action cannot be undone.</p><div class="dialog-actions"><button class="secondary-button" type="button" data-close-dialog="delete-dialog">Cancel</button><button class="danger-button" type="submit">Delete</button></div></form>
  </dialog>
  <dialog id="settings-dialog" class="admin-dialog small-dialog">
    <form id="password-form" novalidate>
      <div class="dialog-heading"><h2>Change password</h2><button class="icon-button" type="button" data-close-dialog="settings-dialog" aria-label="Close">&times;</button></div>
      <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required></div>
      <p id="password-status" class="inline-status" role="status"></p>
      <div class="dialog-actions"><button class="secondary-button" type="button" data-close-dialog="settings-dialog">Cancel</button><button class="primary-button" type="submit">Update password</button></div>
    </form>
  </dialog>
  <script src="../data/supplier-factories.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
